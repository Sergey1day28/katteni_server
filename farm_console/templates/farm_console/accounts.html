{% extends "farm_console/base.html" %}
{% block title %}Аккаунты{% endblock %}
{% block content %}
<h1>Аккаунты</h1>
<form method="get" class="toolbar">
  <input name="q" value="{{ query }}" placeholder="email, имя, id">
  <button type="submit" class="btn-primary">Найти</button>
</form>
<div class="table-wrap">
<table>
  <tr><th>Email</th><th>Баланс</th></tr>
  {% for account in accounts %}
  <tr>
    <td><a href="{% url 'farm-account' account.id %}">{{ account.email }}</a></td>
    <td>{{ account.balance }}</td>
  </tr>
  {% empty %}
  <tr><td colspan="2">Нет аккаунтов</td></tr>
  {% endfor %}
</table>
</div>
{% endblock %}
