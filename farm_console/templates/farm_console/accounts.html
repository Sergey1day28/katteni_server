{% extends "farm_console/base.html" %}
{% block title %}Аккаунты{% endblock %}
{% block content %}
<h1>Аккаунты</h1>
<div class="card" id="accounts-search" data-search-url="{% url 'farm-accounts-search' %}" data-open-url="{% url 'farm-accounts-open' %}" data-close-url="{% url 'farm-accounts-close' %}">
  {% csrf_token %}
  <div id="accounts-open-msg"></div>
  <p class="muted">Поиск</p>
  <ul class="list" id="filter-chips"></ul>
  <p class="row">
    <details class="filter-add">
      <summary>Фильтр</summary>
      <div class="filter-picker">
        {% for item in filter_presets %}
          <button type="button" data-filter-key="{{ item.key }}" data-filter-title="{{ item.title }}">{{ item.title }}</button>
        {% endfor %}
      </div>
    </details>
    <button type="button" class="btn-primary" id="filter-search">Искать</button>
  </p>
  <p class="row">
    <input id="email-query" placeholder="email" size="32">
    <button type="button" id="email-search">Искать</button>
  </p>
  <div id="accounts-found">
    {% include "farm_console/accounts_found.html" %}
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('accounts-search');
  if (!root) return;
  var chips = [];
  var list = document.getElementById('filter-chips');
  var foundBox = document.getElementById('accounts-found');
  var token = root.querySelector('input[name="csrfmiddlewaretoken"]');
  var emailInput = document.getElementById('email-query');
  var openMsg = document.getElementById('accounts-open-msg');

  function bindPickAll() {
    var all = document.getElementById('pick-all');
    if (!all) return;
    all.addEventListener('change', function () {
      foundBox.querySelectorAll('input[name="account_id"]').forEach(function (box) {
        box.checked = all.checked;
      });
    });
  }
  bindPickAll();

  function showOpenMessage(text, ok) {
    if (!openMsg) return;
    openMsg.className = ok ? 'msg' : 'msg warn';
    openMsg.textContent = text || '';
  }

  function postAccountCommand(url, ids, failText) {
    if (!ids.length || !url) return;
    var data = new FormData();
    data.append('csrfmiddlewaretoken', token ? token.value : '');
    ids.forEach(function (id) {
      data.append('account_id', id);
    });
    fetch(url, {
      method: 'POST',
      headers: { 'X-Requested-With': 'XMLHttpRequest' },
      body: data
    }).then(function (response) {
      return response.json();
    }).then(function (body) {
      showOpenMessage(body.message || '', !!body.ok);
    }).catch(function () {
      showOpenMessage(failText, false);
    });
  }

  function openAccounts(ids) {
    postAccountCommand(root.getAttribute('data-open-url'), ids, 'Не удалось поставить open');
  }

  function closeAccounts(ids) {
    postAccountCommand(root.getAttribute('data-close-url'), ids, 'Не удалось поставить close');
  }

  function renderChips() {
    list.innerHTML = '';
    chips.forEach(function (item, index) {
      var row = document.createElement('li');
      row.className = 'filter-chip';
      var remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'filter-chip-x';
      remove.setAttribute('data-index', String(index));
      remove.setAttribute('aria-label', 'убрать');
      remove.textContent = '×';
      var label = document.createElement('span');
      label.textContent = item.title;
      row.appendChild(remove);
      row.appendChild(label);
      list.appendChild(row);
    });
  }

  function addChip(key, title) {
    var exists = chips.some(function (item) {
      return item.key === key;
    });
    if (exists) return;
    chips.push({ key: key, title: title });
    renderChips();
  }

  function runSearch(data, after) {
    fetch(root.getAttribute('data-search-url'), {
      method: 'POST',
      headers: { 'X-Requested-With': 'XMLHttpRequest' },
      body: data
    }).then(function (response) {
      if (response.status === 204) return null;
      if (!response.ok) return null;
      return response.text();
    }).then(function (html) {
      if (html == null) return;
      foundBox.innerHTML = html;
      bindPickAll();
      if (after) after();
    });
  }

  root.querySelectorAll('[data-filter-key]').forEach(function (button) {
    button.addEventListener('click', function () {
      addChip(
        button.getAttribute('data-filter-key'),
        button.getAttribute('data-filter-title')
      );
    });
  });

  list.addEventListener('click', function (event) {
    var button = event.target.closest('.filter-chip-x');
    if (!button) return;
    var index = parseInt(button.getAttribute('data-index'), 10);
    if (isNaN(index)) return;
    chips.splice(index, 1);
    renderChips();
  });

  document.getElementById('filter-search').addEventListener('click', function () {
    if (!chips.length) return;
    var data = new FormData();
    data.append('csrfmiddlewaretoken', token ? token.value : '');
    chips.forEach(function (item) {
      data.append('filter_key', item.key);
    });
    runSearch(data, function () {
      chips = [];
      renderChips();
    });
  });

  function searchEmail() {
    var value = (emailInput.value || '').trim();
    if (!value) return;
    var data = new FormData();
    data.append('csrfmiddlewaretoken', token ? token.value : '');
    data.append('email', value);
    runSearch(data);
  }

  document.getElementById('email-search').addEventListener('click', searchEmail);
  emailInput.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') {
      event.preventDefault();
      searchEmail();
    }
  });

  foundBox.addEventListener('click', function (event) {
    var closeOne = event.target.closest('[data-close-account]');
    if (closeOne) {
      closeAccounts([closeOne.getAttribute('data-close-account')]);
      return;
    }
    var one = event.target.closest('[data-open-account]');
    if (one) {
      openAccounts([one.getAttribute('data-open-account')]);
      return;
    }
    if (event.target.closest('#open-selected')) {
      var ids = [];
      foundBox.querySelectorAll('input[name="account_id"]:checked').forEach(function (box) {
        ids.push(box.value);
      });
      openAccounts(ids);
    }
  });
})();
</script>
{% endblock %}
